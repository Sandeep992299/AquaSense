<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alerts &amp; Notifications – AquaSense Portal</title>
  <meta name="description" content="Real-time anomalies, utility leakage detection and system alerts powered by AWS SNS." />
  <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.7/dist/amazon-cognito-identity.min.js"></script>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="alerts.css" />
  <script src="config.js"></script>
</head>
<body>

<!-- LOGIN OVERLAY (shared markup) -->
<div class="login-overlay" id="login-overlay">
  <div class="login-modal">
    <div class="login-brand">
      <svg width="36" height="36" viewBox="0 0 28 28" fill="none">
        <path d="M14 2C14 2 5 10 5 16.5C5 21.2 9.03 25 14 25C18.97 25 23 21.2 23 16.5C23 10 14 2 14 2Z" fill="url(#wge)"/>
        <defs><linearGradient id="wge" x1="5" y1="2" x2="23" y2="25" gradientUnits="userSpaceOnUse"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs>
      </svg>
      <div><div class="login-brand-name">AquaSense</div><div class="login-brand-sub">Smart Utilities Portal</div></div>
    </div>
    <h2 class="login-title" id="login-title">Welcome back</h2>
    <p class="login-sub">Sign in to monitor your water &amp; energy</p>
    <div class="login-error" id="login-error"></div>
    <form id="login-form">
      <div class="login-field"><label>Email</label><input type="email" id="login-email" placeholder="rajesh@aquasense.in" required /></div>
      <div class="login-field"><label>Password</label><input type="password" id="login-password" placeholder="••••••••" required /></div>
      <button type="submit" id="btn-login" class="btn-login">Sign In</button>
    </form>
    <div class="login-forgot"><a href="#" id="btn-forgot-password">Forgot password?</a></div>
    <div class="login-divider" id="login-divider"><span>or</span></div>
    <button id="btn-demo" class="btn-demo">🎭 Continue in Demo Mode</button>
    <div class="login-footer" id="login-footer-signin">Don't have an account? <a href="#" id="link-show-signup">Sign Up</a></div>
    <div id="new-pw-panel" style="display:none">
      <div class="login-field"><label>New Password</label><input type="password" id="new-pw-input" /></div>
      <div class="login-field"><label>Confirm Password</label><input type="password" id="new-pw-confirm" /></div>
      <button id="btn-set-password" class="btn-login">Set Password &amp; Sign In</button>
    </div>
    <div id="signup-panel" style="display:none;margin-top:12px">
      <form id="signup-form">
        <div class="login-field"><label>Full Name</label><input type="text" id="signup-name" required /></div>
        <div class="login-field"><label>Email</label><input type="email" id="signup-email" required /></div>
        <div class="login-field"><label>Password</label><input type="password" id="signup-password" required /></div>
        <div class="login-field"><label>Meter ID (Optional)</label><input type="text" id="signup-meter" /></div>
        <button type="submit" id="btn-signup-submit" class="btn-login">Create Account</button>
      </form>
      <div class="login-footer" style="margin-top:12px">Already have an account? <a href="#" id="link-show-login">Sign In</a></div>
    </div>
    <div id="verify-panel" style="display:none;margin-top:12px">
      <div class="login-field"><label>Verification Code</label><input type="text" id="verify-code" placeholder="123456" /></div>
      <button id="btn-verify-submit" class="btn-login">Verify &amp; Sign In</button>
    </div>
    <div id="forgot-pw-panel" style="display:none;margin-top:12px">
      <div class="login-field"><label>Email</label><input type="email" id="forgot-email" /></div>
      <div style="display:flex;gap:8px"><button id="btn-send-code" class="btn-login" style="flex:1">Send Code</button><button onclick="toggleForgotPw(false)" class="btn-demo" style="flex:0.5">Cancel</button></div>
      <div id="forgot-confirm-panel" style="display:none;margin-top:12px">
        <div class="login-field"><label>Code</label><input type="text" id="forgot-code" /></div>
        <div class="login-field"><label>New Password</label><input type="password" id="forgot-new-pw" /></div>
        <button id="btn-confirm-reset" class="btn-login" style="width:100%">Reset Password</button>
      </div>
    </div>
  </div>
</div>

<div id="demo-notice" class="demo-notice" style="display:none"></div>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside><!-- filled by sidebar.js -->

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" onclick="toggleSidebar()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="breadcrumb">🚨 Alerts &amp; Notifications</div>
      </div>
      <div class="topbar-right">
        <div class="aws-status-pill"><span class="pulse-dot"></span><span>AWS Connected</span></div>
        <div class="date-display" id="live-date"></div>
        <button class="icon-btn" title="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="notif-dot"></span></button>
      </div>
    </header>

    <div class="content">
      <div class="section-header">
        <h2>Alerts &amp; Notifications</h2>
        <p>Smart alerts powered by AWS SNS and Lambda anomaly detection</p>
      </div>

      <div class="alert-controls">
        <button class="filter-btn active" id="btn-filter-all" onclick="filterAlerts('all',this)">All</button>
        <button class="filter-btn" id="btn-filter-critical" onclick="filterAlerts('critical',this)">Critical</button>
        <button class="filter-btn" id="btn-filter-warning" onclick="filterAlerts('warning',this)">Warning</button>
        <button class="filter-btn" id="btn-filter-info" onclick="filterAlerts('info',this)">Info</button>
      </div>

      <div class="alerts-full-list" id="alerts-full"></div>
    </div>
  </main>
</div>

<script src="shared.js"></script>
<script src="sidebar.js"></script>
<script src="alerts.js"></script>
</body>
</html>
