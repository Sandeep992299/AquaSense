name: 🚀 AquaSense CI/CD – Build, Push ECR & Deploy ECS

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      service:
        description: 'Force deploy specific service (or "all")'
        required: false
        default: 'all'

env:
  AWS_REGION:    ap-south-1
  ECR_REGISTRY:  595529181954.dkr.ecr.ap-south-1.amazonaws.com
  NAME_PREFIX:   tf-aqua-sense-production
  CLUSTER_NAME:  tf-aqua-sense-production-cluster
  S3_PORTAL:     aquasense-portal

permissions:
  contents: read
  id-token: write   # Required for OIDC authentication

# ─────────────────────────────────────────────────────────────────
# JOB 0 – Detect which services changed
# ─────────────────────────────────────────────────────────────────
jobs:
  changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      user:    ${{ steps.filter.outputs.user }}
      billing: ${{ steps.filter.outputs.billing }}
      usage:   ${{ steps.filter.outputs.usage }}
      alert:   ${{ steps.filter.outputs.alert }}
      portal:  ${{ steps.filter.outputs.portal }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # needed for path filtering on first commit

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            user:
              - 'services/user-service/**'
            billing:
              - 'services/billing-service/**'
            usage:
              - 'services/usage-service/**'
            alert:
              - 'services/alert-service/**'
            portal:
              - 'portal/**'

# ─────────────────────────────────────────────────────────────────
# REUSABLE STEP TEMPLATE (defined inline per service)
# Each job: checkout → AWS login → ECR login → build → push → ECS deploy
# ─────────────────────────────────────────────────────────────────

# ─── USER-SERVICE ────────────────────────────────────────────────
  user-service:
    name: 👤 user-service
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.user == 'true' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker image
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.NAME_PREFIX }}/user-service
          TAG:   ${{ github.sha }}
        run: |
          echo "Building user-service image: $IMAGE:$TAG"
          docker build \
            --build-arg IMAGE_TAG=$TAG \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t $IMAGE:$TAG \
            -t $IMAGE:latest \
            -f services/user-service/Dockerfile \
            services/user-service/
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
          echo "✅ Pushed $IMAGE:$TAG"

      - name: Deploy to ECS – force new deployment
        run: |
          aws ecs update-service \
            --cluster  ${{ env.CLUSTER_NAME }} \
            --service  ${{ env.NAME_PREFIX }}-user-service \
            --force-new-deployment \
            --region   ${{ env.AWS_REGION }} \
            --query    "service.{status:status,desiredCount:desiredCount}" \
            --output   json

      - name: Wait for ECS stability
        run: |
          echo "Waiting for user-service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.CLUSTER_NAME }} \
            --services ${{ env.NAME_PREFIX }}-user-service \
            --region  ${{ env.AWS_REGION }}
          echo "✅ user-service is stable"

# ─── BILLING-SERVICE ─────────────────────────────────────────────
  billing-service:
    name: 💰 billing-service
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.billing == 'true' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker image
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.NAME_PREFIX }}/billing-service
          TAG:   ${{ github.sha }}
        run: |
          echo "Building billing-service image: $IMAGE:$TAG"
          docker build \
            --build-arg IMAGE_TAG=$TAG \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t $IMAGE:$TAG \
            -t $IMAGE:latest \
            -f services/billing-service/Dockerfile \
            services/billing-service/
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
          echo "✅ Pushed $IMAGE:$TAG"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster  ${{ env.CLUSTER_NAME }} \
            --service  ${{ env.NAME_PREFIX }}-billing-service \
            --force-new-deployment \
            --region   ${{ env.AWS_REGION }} \
            --query    "service.{status:status,desiredCount:desiredCount}" \
            --output   json

      - name: Wait for ECS stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.CLUSTER_NAME }} \
            --services ${{ env.NAME_PREFIX }}-billing-service \
            --region  ${{ env.AWS_REGION }}
          echo "✅ billing-service is stable"

# ─── USAGE-SERVICE ───────────────────────────────────────────────
  usage-service:
    name: 📊 usage-service
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.usage == 'true' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker image
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.NAME_PREFIX }}/usage-service
          TAG:   ${{ github.sha }}
        run: |
          echo "Building usage-service image: $IMAGE:$TAG"
          docker build \
            --build-arg IMAGE_TAG=$TAG \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t $IMAGE:$TAG \
            -t $IMAGE:latest \
            -f services/usage-service/Dockerfile \
            services/usage-service/
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
          echo "✅ Pushed $IMAGE:$TAG"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
