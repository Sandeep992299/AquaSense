      - name: Wait for ECS stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.CLUSTER_NAME }} \
            --services ${{ env.NAME_PREFIX }}-usage-service \
            --region  ${{ env.AWS_REGION }}
          echo "✅ usage-service is stable"

# ─── ALERT-SERVICE ───────────────────────────────────────────────
  alert-service:
    name: 🚨 alert-service
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.alert == 'true' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker image
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.NAME_PREFIX }}/alert-service
          TAG:   ${{ github.sha }}
        run: |
          echo "Building alert-service image: $IMAGE:$TAG"
          docker build \
            --build-arg IMAGE_TAG=$TAG \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t $IMAGE:$TAG \
            -t $IMAGE:latest \
            -f services/alert-service/Dockerfile \
            services/alert-service/
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
          echo "✅ Pushed $IMAGE:$TAG"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster  ${{ env.CLUSTER_NAME }} \
            --service  ${{ env.NAME_PREFIX }}-alert-service \
            --force-new-deployment \
            --region   ${{ env.AWS_REGION }} \
            --query    "service.{status:status,desiredCount:desiredCount}" \
            --output   json

      - name: Wait for ECS stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.CLUSTER_NAME }} \
            --services ${{ env.NAME_PREFIX }}-alert-service \
            --region  ${{ env.AWS_REGION }}
          echo "✅ alert-service is stable"

# ─── PORTAL (S3 sync) ────────────────────────────────────────────
  portal:
    name: 🌐 Portal → S3
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.portal == 'true' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Sync portal to S3
        run: |
          echo "Syncing portal/ to s3://${{ env.S3_PORTAL }}"
          aws s3 sync portal/ s3://${{ env.S3_PORTAL }}/ \
            --delete \
            --cache-control "no-cache, no-store, must-revalidate" \
            --region ${{ env.AWS_REGION }}
          echo "✅ Portal deployed to S3"

# ─── SUMMARY ─────────────────────────────────────────────────────
  summary:
    name: 📋 Deployment Summary
    runs-on: ubuntu-latest
    needs: [user-service, billing-service, usage-service, alert-service, portal]
    if: always()

    steps:
      - name: Print deployment summary
        run: |
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║        AquaSense CI/CD Deployment Summary            ║"
          echo "╠══════════════════════════════════════════════════════╣"
          echo "║  Commit  : ${{ github.sha }}"
          echo "║  Branch  : ${{ github.ref_name }}"
          echo "║  Actor   : ${{ github.actor }}"
          echo "║  Trigger : ${{ github.event_name }}"
          echo "╠══════════════════════════════════════════════════════╣"
          echo "║  user-service    : ${{ needs.user-service.result }}"
          echo "║  billing-service : ${{ needs.billing-service.result }}"
          echo "║  usage-service   : ${{ needs.usage-service.result }}"
          echo "║  alert-service   : ${{ needs.alert-service.result }}"
          echo "║  portal (S3)     : ${{ needs.portal.result }}"
          echo "╚══════════════════════════════════════════════════════╝"