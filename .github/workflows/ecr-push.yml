name: 🚀 AquaSense CI/CD – Build, Push ECR & Deploy ECS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  AWS_REGION:    ap-south-1
  ECR_REGISTRY:  595529181954.dkr.ecr.ap-south-1.amazonaws.com
  NAME_PREFIX:   tf-aqua-sense-production
  CLUSTER_NAME:  tf-aqua-sense-production-cluster
  S3_PORTAL:     aquasense-portal

# ─────────────────────────────────────────────────────────────────
# All jobs run in parallel on every push to main / manual trigger
# ─────────────────────────────────────────────────────────────────
jobs:

# ─── USER-SERVICE ────────────────────────────────────────────────
  user-service:
    name: 👤 user-service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.NAME_PREFIX }}/user-service
          TAG:   ${{ github.sha }}
        run: |
          echo "▶ Building user-service → $IMAGE:$TAG"
          docker build \
            --build-arg IMAGE_TAG=$TAG \
            -t $IMAGE:$TAG \
            -t $IMAGE:latest \
            -f services/user-service/Dockerfile \
            services/
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
          echo "✅ Pushed $IMAGE:$TAG"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster  ${{ env.CLUSTER_NAME }} \
            --service  ${{ env.NAME_PREFIX }}-user-service \
            --force-new-deployment \
            --region   ${{ env.AWS_REGION }} \
            --output   json | python3 -c "import sys,json; s=json.load(sys.stdin)['service']; print(f'Service: {s[\"status\"]} | Desired: {s[\"desiredCount\"]} | Running: {s[\"runningCount\"]}')"
          echo "✅ user-service deployment triggered"

# ─── BILLING-SERVICE ─────────────────────────────────────────────
  billing-service:
    name: 💰 billing-service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.NAME_PREFIX }}/billing-service
          TAG:   ${{ github.sha }}
        run: |
          echo "▶ Building billing-service → $IMAGE:$TAG"
          docker build \
            --build-arg IMAGE_TAG=$TAG \
            -t $IMAGE:$TAG \
            -t $IMAGE:latest \
            -f services/billing-service/Dockerfile \
            services/
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
          echo "✅ Pushed $IMAGE:$TAG"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster  ${{ env.CLUSTER_NAME }} \
            --service  ${{ env.NAME_PREFIX }}-billing-service \
            --force-new-deployment \
            --region   ${{ env.AWS_REGION }} \
            --output   json | python3 -c "import sys,json; s=json.load(sys.stdin)['service']; print(f'Service: {s[\"status\"]} | Desired: {s[\"desiredCount\"]} | Running: {s[\"runningCount\"]}')"
          echo "✅ billing-service deployment triggered"

# ─── USAGE-SERVICE ───────────────────────────────────────────────
  usage-service:
    name: 📊 usage-service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.NAME_PREFIX }}/usage-service
          TAG:   ${{ github.sha }}
        run: |
          echo "▶ Building usage-service → $IMAGE:$TAG"
          docker build \
            --build-arg IMAGE_TAG=$TAG \
            -t $IMAGE:$TAG \
            -t $IMAGE:latest \
            -f services/usage-service/Dockerfile \
            services/
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
          echo "✅ Pushed $IMAGE:$TAG"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster  ${{ env.CLUSTER_NAME }} \
            --service  ${{ env.NAME_PREFIX }}-usage-service \
            --force-new-deployment \
            --region   ${{ env.AWS_REGION }} \
            --output   json | python3 -c "import sys,json; s=json.load(sys.stdin)['service']; print(f'Service: {s[\"status\"]} | Desired: {s[\"desiredCount\"]} | Running: {s[\"runningCount\"]}')"
          echo "✅ usage-service deployment triggered"

# ─── ALERT-SERVICE ───────────────────────────────────────────────
  alert-service:
    name: 🚨 alert-service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.NAME_PREFIX }}/alert-service
          TAG:   ${{ github.sha }}
        run: |
          echo "▶ Building alert-service → $IMAGE:$TAG"
          docker build \
            --build-arg IMAGE_TAG=$TAG \
            -t $IMAGE:$TAG \
            -t $IMAGE:latest \
            -f services/alert-service/Dockerfile \
            services/
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
          echo "✅ Pushed $IMAGE:$TAG"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster  ${{ env.CLUSTER_NAME }} \
            --service  ${{ env.NAME_PREFIX }}-alert-service \
            --force-new-deployment \
            --region   ${{ env.AWS_REGION }} \
            --output   json | python3 -c "import sys,json; s=json.load(sys.stdin)['service']; print(f'Service: {s[\"status\"]} | Desired: {s[\"desiredCount\"]} | Running: {s[\"runningCount\"]}')"
          echo "✅ alert-service deployment triggered"

# ─── PORTAL → S3 ─────────────────────────────────────────────────
  portal:
    name: 🌐 Portal → S3
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Sync portal to S3
        run: |
          echo "▶ Syncing portal/ → s3://${{ env.S3_PORTAL }}/"
          aws s3 sync portal/ s3://${{ env.S3_PORTAL }}/ \
            --delete \
            --cache-control "no-cache, no-store, must-revalidate" \
            --region ${{ env.AWS_REGION }}
          echo "✅ Portal live at http://${{ env.S3_PORTAL }}.s3-website.${{ env.AWS_REGION }}.amazonaws.com"

# ─── SUMMARY ─────────────────────────────────────────────────────
  summary:
    name: 📋 Deployment Summary
    runs-on: ubuntu-latest
    needs: [user-service, billing-service, usage-service, alert-service, portal]
    if: always()

    steps:
      - name: Print summary
        run: |
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║       AquaSense – Deployment Summary                 ║"
          echo "╠══════════════════════════════════════════════════════╣"
          echo "║  Commit  : ${{ github.sha }}"
          echo "║  Branch  : ${{ github.ref_name }}"
          echo "║  Actor   : ${{ github.actor }}"
          echo "║  Trigger : ${{ github.event_name }}"
          echo "╠══════════════════════════════════════════════════════╣"
          echo "║  👤 user-service    : ${{ needs.user-service.result }}"
          echo "║  💰 billing-service : ${{ needs.billing-service.result }}"
          echo "║  📊 usage-service   : ${{ needs.usage-service.result }}"
          echo "║  🚨 alert-service   : ${{ needs.alert-service.result }}"
          echo "║  🌐 portal (S3)     : ${{ needs.portal.result }}"
          echo "╚══════════════════════════════════════════════════════╝"