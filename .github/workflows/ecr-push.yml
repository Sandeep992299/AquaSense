name: Build, Push to ECR & Deploy ECS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  NAME_PREFIX: tf-aqua-sense-production
  CLUSTER_NAME: aqua-sense-cluster   # CHANGE THIS
  ECS_SERVICE_PREFIX: aqua-sense     # CHANGE THIS

permissions:
  contents: read
  id-token: write

jobs:

# ─────────────────────────────────────────────
# 1. Detect changes
# ─────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      user: ${{ steps.filter.outputs.user }}
      billing: ${{ steps.filter.outputs.billing }}
      usage: ${{ steps.filter.outputs.usage }}
      alert: ${{ steps.filter.outputs.alert }}

    steps:
      - uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            user:
              - 'services/user-service/**'
            billing:
              - 'services/billing-service/**'
            usage:
              - 'services/usage-service/**'
            alert:
              - 'services/alert-service/**'


# ─────────────────────────────────────────────
# 2. BUILD + PUSH + DEPLOY TEMPLATE LOGIC
# (same pattern repeated per service)
# ─────────────────────────────────────────────

  user-service:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.user == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4

      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ env.NAME_PREFIX }}/user-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE=$REGISTRY/$REPO
          docker build -t $IMAGE:$IMAGE_TAG -t $IMAGE:latest services/
          docker push $IMAGE:$IMAGE_TAG
          docker push $IMAGE:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $ECS_SERVICE_PREFIX-user-service \
            --force-new-deployment


# ─────────────────────────────────────────────
# billing-service
# ─────────────────────────────────────────────
  billing-service:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.billing == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4

      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ env.NAME_PREFIX }}/billing-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE=$REGISTRY/$REPO
          docker build -t $IMAGE:$IMAGE_TAG -t $IMAGE:latest services/
          docker push $IMAGE:$IMAGE_TAG
          docker push $IMAGE:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $ECS_SERVICE_PREFIX-billing-service \
            --force-new-deployment


# ─────────────────────────────────────────────
# usage-service
# ─────────────────────────────────────────────
  usage-service:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.usage == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build & Push
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.NAME_PREFIX }}/usage-service
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest services/
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $ECS_SERVICE_PREFIX-usage-service \
            --force-new-deployment


# ─────────────────────────────────────────────
# alert-service
# ─────────────────────────────────────────────
  alert-service:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.alert == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.NAME_PREFIX }}/alert-service
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest services/
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $ECS_SERVICE_PREFIX-alert-service \
            --force-new-deployment