name: 🚀 AquaSense CI/CD – Build, Push ECR & Deploy ECS

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      service:
        description: 'Force deploy specific service (or "all")'
        required: false
        default: 'all'

env:
  AWS_REGION:    ap-south-1
  ECR_REGISTRY:  595529181954.dkr.ecr.ap-south-1.amazonaws.com
  NAME_PREFIX:   tf-aqua-sense-production
  CLUSTER_NAME:  tf-aqua-sense-production-cluster
  S3_PORTAL:     aquasense-portal

# ─────────────────────────────────────────────────────────────────
# JOB 0 – Detect which services changed
# ─────────────────────────────────────────────────────────────────
jobs:
  changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      user:    ${{ steps.filter.outputs.user }}
      billing: ${{ steps.filter.outputs.billing }}
      usage:   ${{ steps.filter.outputs.usage }}
      alert:   ${{ steps.filter.outputs.alert }}
      portal:  ${{ steps.filter.outputs.portal }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            user:
              - 'services/user-service/**'
            billing:
              - 'services/billing-service/**'
            usage:
              - 'services/usage-service/**'
            alert:
              - 'services/alert-service/**'
            portal:
              - 'portal/**'

# ─── USER-SERVICE ────────────────────────────────────────────────
  user-service:
    name: 👤 user-service
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.user == 'true' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker image
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.NAME_PREFIX }}/user-service
          TAG:   ${{ github.sha }}
        run: |
          echo "▶ Building user-service → $IMAGE:$TAG"
          docker build \
            --build-arg IMAGE_TAG=$TAG \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t $IMAGE:$TAG \
            -t $IMAGE:latest \
            -f services/user-service/Dockerfile \
            services/user-service/
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
          echo "✅ Pushed $IMAGE:$TAG"

      - name: Force-deploy to ECS
        run: |
          aws ecs update-service \
            --cluster  ${{ env.CLUSTER_NAME }} \
            --service  ${{ env.NAME_PREFIX }}-user-service \
            --force-new-deployment \
            --region   ${{ env.AWS_REGION }} \
            --query    "service.{status:status,desired:desiredCount,running:runningCount}" \
            --output   table

      - name: Wait for service stability
        run: |
          echo "⏳ Waiting for user-service to stabilise..."
          aws ecs wait services-stable \
            --cluster  ${{ env.CLUSTER_NAME }} \
            --services ${{ env.NAME_PREFIX }}-user-service \
            --region   ${{ env.AWS_REGION }}
          echo "✅ user-service is stable"

# ─── BILLING-SERVICE ─────────────────────────────────────────────
  billing-service:
    name: 💰 billing-service
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.billing == 'true' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker image
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.NAME_PREFIX }}/billing-service
          TAG:   ${{ github.sha }}
        run: |
          echo "▶ Building billing-service → $IMAGE:$TAG"
          docker build \
            --build-arg IMAGE_TAG=$TAG \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t $IMAGE:$TAG \
            -t $IMAGE:latest \
            -f services/billing-service/Dockerfile \
            services/billing-service/
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
          echo "✅ Pushed $IMAGE:$TAG"

      - name: Force-deploy to ECS
        run: |
          aws ecs update-service \
            --cluster  ${{ env.CLUSTER_NAME }} \
            --service  ${{ env.NAME_PREFIX }}-billing-service \
            --force-new-deployment \
            --region   ${{ env.AWS_REGION }} \
            --query    "service.{status:status,desired:desiredCount,running:runningCount}" \
            --output   table

      - name: Wait for service stability
        run: |
          echo "⏳ Waiting for billing-service to stabilise..."
          aws ecs wait services-stable \
            --cluster  ${{ env.CLUSTER_NAME }} \
            --services ${{ env.NAME_PREFIX }}-billing-service \
            --region   ${{ env.AWS_REGION }}
          echo "✅ billing-service is stable"

# ─── USAGE-SERVICE ───────────────────────────────────────────────
  usage-service:
    name: 📊 usage-service
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.usage == 'true' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker image
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.NAME_PREFIX }}/usage-service
          TAG:   ${{ github.sha }}
        run: |
          echo "▶ Building usage-service → $IMAGE:$TAG"
          docker build \
            --build-arg IMAGE_TAG=$TAG \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t $IMAGE:$TAG \
            -t $IMAGE:latest \
            -f services/usage-service/Dockerfile \
            services/usage-service/
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
          echo "✅ Pushed $IMAGE:$TAG"

      - name: Force-deploy to ECS
        run: |
          aws ecs update-service \
            --cluster  ${{ env.CLUSTER_NAME }} \
            --service  ${{ env.NAME_PREFIX }}-usage-service \
            --force-new-deployment \
            --region   ${{ env.AWS_REGION }} \
            --query    "service.{status:status,desired:desiredCount,running:runningCount}" \
            --output   table

      - name: Wait for service stability
        run: |
          echo "⏳ Waiting for usage-service to stabilise..."
          aws ecs wait services-stable \
            --cluster  ${{ env.CLUSTER_NAME }} \
            --services ${{ env.NAME_PREFIX }}-usage-service \
            --region   ${{ env.AWS_REGION }}
          echo "✅ usage-service is stable"

# ─── ALERT-SERVICE ───────────────────────────────────────────────
  alert-service:
    name: 🚨 alert-service
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.alert == 'true' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker image
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.NAME_PREFIX }}/alert-service
          TAG:   ${{ github.sha }}
        run: |
          echo "▶ Building alert-service → $IMAGE:$TAG"
          docker build \
            --build-arg IMAGE_TAG=$TAG \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t $IMAGE:$TAG \
            -t $IMAGE:latest \
            -f services/alert-service/Dockerfile \
            services/alert-service/
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
          echo "✅ Pushed $IMAGE:$TAG"

      - name: Force-deploy to ECS
        run: |
          aws ecs update-service \
            --cluster  ${{ env.CLUSTER_NAME }} \
            --service  ${{ env.NAME_PREFIX }}-alert-service \
            --force-new-deployment \
            --region   ${{ env.AWS_REGION }} \
            --query    "service.{status:status,desired:desiredCount,running:runningCount}" \
            --output   table

      - name: Wait for service stability
        run: |
          echo "⏳ Waiting for alert-service to stabilise..."
          aws ecs wait services-stable \
            --cluster  ${{ env.CLUSTER_NAME }} \
            --services ${{ env.NAME_PREFIX }}-alert-service \
            --region   ${{ env.AWS_REGION }}
          echo "✅ alert-service is stable"

# ─── PORTAL → S3 ─────────────────────────────────────────────────
  portal:
    name: 🌐 Portal → S3
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.portal == 'true' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Sync portal to S3
        run: |
          echo "▶ Syncing portal/ → s3://${{ env.S3_PORTAL }}/"
          aws s3 sync portal/ s3://${{ env.S3_PORTAL }}/ \
            --delete \
            --cache-control "no-cache, no-store, must-revalidate" \
            --region ${{ env.AWS_REGION }}
          echo "✅ Portal live at http://${{ env.S3_PORTAL }}.s3-website.${{ env.AWS_REGION }}.amazonaws.com"

# ─── SUMMARY ─────────────────────────────────────────────────────
  summary:
    name: 📋 Deployment Summary
    runs-on: ubuntu-latest
    needs: [changes, user-service, billing-service, usage-service, alert-service, portal]
    if: always()

    steps:
      - name: Print deployment summary
        run: |
          echo "╔════════════════════════════════════════════════════════╗"
          echo "║         AquaSense CI/CD – Deployment Summary           ║"
          echo "╠════════════════════════════════════════════════════════╣"
          echo "║  Commit   : ${{ github.sha }}"
          echo "║  Branch   : ${{ github.ref_name }}"
          echo "║  Actor    : ${{ github.actor }}"
          echo "║  Trigger  : ${{ github.event_name }}"
          echo "╠════════════════════════════════════════════════════════╣"
          echo "║  user-service    changed=${{ needs.changes.outputs.user }}    result=${{ needs.user-service.result }}"
          echo "║  billing-service changed=${{ needs.changes.outputs.billing }} result=${{ needs.billing-service.result }}"
          echo "║  usage-service   changed=${{ needs.changes.outputs.usage }}   result=${{ needs.usage-service.result }}"
          echo "║  alert-service   changed=${{ needs.changes.outputs.alert }}   result=${{ needs.alert-service.result }}"
          echo "║  portal (S3)     changed=${{ needs.changes.outputs.portal }}  result=${{ needs.portal.result }}"
          echo "╚════════════════════════════════════════════════════════╝"