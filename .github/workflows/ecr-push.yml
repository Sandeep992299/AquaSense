name: Build, Push to ECR & Deploy ECS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  NAME_PREFIX: tf-aqua-sense-production
  ECS_CLUSTER: aqua-sense-prod-cluster

permissions:
  contents: read
  id-token: write

jobs:

# ============================================================
# 1. Detect Changes
# ============================================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      user-service: ${{ steps.filter.outputs.user-service }}
      billing-service: ${{ steps.filter.outputs.billing-service }}
      usage-service: ${{ steps.filter.outputs.usage-service }}
      alert-service: ${{ steps.filter.outputs.alert-service }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 🔥 FIXED

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            user-service:
              - 'services/user-service/**'
            billing-service:
              - 'services/billing-service/**'
            usage-service:
              - 'services/usage-service/**'
            alert-service:
              - 'services/alert-service/**'


# ============================================================
# 2. USER SERVICE
# ============================================================
  user-service:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.user-service == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: ${{ env.NAME_PREFIX }}/user-service
          SHA: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$IMAGE:$SHA -f services/user-service/Dockerfile services/
          docker push $REGISTRY/$IMAGE:$SHA

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service user-service \
            --force-new-deployment


# ============================================================
# 3. BILLING SERVICE
# ============================================================
  billing-service:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.billing-service == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: ${{ env.NAME_PREFIX }}/billing-service
          SHA: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$IMAGE:$SHA -f services/billing-service/Dockerfile services/
          docker push $REGISTRY/$IMAGE:$SHA

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service billing-service \
            --force-new-deployment


# ============================================================
# 4. USAGE SERVICE
# ============================================================
  usage-service:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.usage-service == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: ${{ env.NAME_PREFIX }}/usage-service
          SHA: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$IMAGE:$SHA -f services/usage-service/Dockerfile services/
          docker push $REGISTRY/$IMAGE:$SHA

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service usage-service \
            --force-new-deployment


# ============================================================
# 5. ALERT SERVICE
# ============================================================
  alert-service:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.alert-service == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: ${{ env.NAME_PREFIX }}/alert-service
          SHA: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$IMAGE:$SHA -f services/alert-service/Dockerfile services/
          docker push $REGISTRY/$IMAGE:$SHA

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service alert-service \
            --force-new-deployment


# ============================================================
# SUMMARY
# ============================================================
  summary:
    runs-on: ubuntu-latest
    needs: [user-service, billing-service, usage-service, alert-service]
    if: always()

    steps:
      - run: |
          echo "==================================="
          echo "ECR + ECS Deployment Completed"
          echo "Commit: ${{ github.sha }}"
          echo "==================================="